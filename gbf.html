<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBF + Oscilloscope virtuel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
header{padding:14px 20px;background:#1b1b1b;border-bottom:1px solid #333}
h1{margin:0;font-size:22px}
main{display:grid;grid-template-columns:310px 1fr;gap:16px;padding:16px;min-height:calc(100vh - 60px)}
.panel{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:16px}
.control{margin-bottom:14px}
label{display:block;margin-bottom:6px;font-size:14px}
input,select,button{width:100%;padding:9px;border-radius:6px;border:1px solid #555;background:#252525;color:#fff}
input[type=range]{padding:0}
button{cursor:pointer;font-weight:bold;margin-top:6px}
button:hover{background:#333}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.value{font-size:13px;color:#aaa;text-align:right;margin-top:3px}
.scope{display:flex;flex-direction:column;gap:10px}
canvas{width:100%;height:520px;background:#050b08;border:1px solid #31513e;border-radius:8px}
.readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.readout{background:#191919;border:1px solid #333;border-radius:7px;padding:10px;text-align:center}
.readout span{display:block;color:#aaa;font-size:12px}
.readout strong{font-size:18px}
.status{padding:8px;text-align:center;border-radius:6px;background:#252525;color:#aaa}
@media(max-width:850px){main{grid-template-columns:1fr}canvas{height:400px}.readouts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>GBF + Oscilloscope virtuel</h1></header>

<main>
<section class="panel">
<h2>Générateur BF</h2>

<div class="control">
<label for="wave">Forme du signal</label>
<select id="wave">
<option value="sine">Sinusoïdal</option>
<option value="square">Carré</option>
<option value="triangle">Triangle</option>
<option value="saw">Dent de scie</option>
</select>
</div>

<div class="control">
<label>Fréquence</label>
<input id="freq" type="range" min="0.5" max="1000" step="0.5" value="10">
<div class="value" id="freqVal">10 Hz</div>
</div>

<div class="control">
<label>Amplitude crête</label>
<input id="amp" type="range" min="0.1" max="10" step="0.1" value="2">
<div class="value" id="ampVal">2.0 V</div>
</div>

<div class="control">
<label>Offset</label>
<input id="offset" type="range" min="-10" max="10" step="0.1" value="0">
<div class="value" id="offsetVal">0.0 V</div>
</div>

<div class="control">
<label>Rapport cyclique (signal carré)</label>
<input id="duty" type="range" min="5" max="95" step="1" value="50">
<div class="value" id="dutyVal">50 %</div>
</div>

<div class="row">
<button id="start">▶ Démarrer</button>
<button id="stop">■ Arrêter</button>
</div>
<button id="reset">↺ Réinitialiser</button>

<hr style="border-color:#333;margin:18px 0">

<h2>Oscilloscope</h2>

<div class="control">
<label>Base de temps</label>
<select id="timebase">
<option value="0.0005">0,5 ms/div</option>
<option value="0.001">1 ms/div</option>
<option value="0.002">2 ms/div</option>
<option value="0.005">5 ms/div</option>
<option value="0.01" selected>10 ms/div</option>
<option value="0.02">20 ms/div</option>
<option value="0.05">50 ms/div</option>
<option value="0.1">100 ms/div</option>
<option value="0.2">200 ms/div</option>
</select>
</div>

<div class="control">
<label>Échelle verticale</label>
<select id="vscale">
<option value="0.5">0,5 V/div</option>
<option value="1">1 V/div</option>
<option value="2" selected>2 V/div</option>
<option value="5">5 V/div</option>
<option value="10">10 V/div</option>
</select>
</div>

<div class="control">
<label>Position verticale</label>
<input id="vpos" type="range" min="-5" max="5" step="0.1" value="0">
<div class="value" id="vposVal">0.0 V</div>
</div>

<div class="status" id="status">Signal arrêté</div>
</section>

<section class="panel scope">
<canvas id="scope" width="1200" height="650"></canvas>

<div class="readouts">
<div class="readout"><span>Fréquence</span><strong id="rFreq">10 Hz</strong></div>
<div class="readout"><span>Amplitude crête</span><strong id="rAmp">2.0 V</strong></div>
<div class="readout"><span>Vmax</span><strong id="rMax">+2.00 V</strong></div>
<div class="readout"><span>Vmin</span><strong id="rMin">-2.00 V</strong></div>
</div>
</section>
</main>

<script>
const canvas=document.getElementById("scope");
const ctx=canvas.getContext("2d");

const wave=document.getElementById("wave");
const freq=document.getElementById("freq");
const amp=document.getElementById("amp");
const offset=document.getElementById("offset");
const duty=document.getElementById("duty");
const timebase=document.getElementById("timebase");
const vscale=document.getElementById("vscale");
const vpos=document.getElementById("vpos");

let running=false;
let animationId;
let startTime=performance.now();

function val(id){return parseFloat(document.getElementById(id).value)}

function updateLabels(){
  document.getElementById("freqVal").textContent=val("freq")+" Hz";
  document.getElementById("ampVal").textContent=val("amp").toFixed(1)+" V";
  document.getElementById("offsetVal").textContent=val("offset").toFixed(1)+" V";
  document.getElementById("dutyVal").textContent=val("duty")+" %";
  document.getElementById("vposVal").textContent=val("vpos").toFixed(1)+" V";
  document.getElementById("rFreq").textContent=val("freq")+" Hz";
  document.getElementById("rAmp").textContent=val("amp").toFixed(1)+" V";
}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",updateLabels));

function signal(t){
  const f=val("freq"), A=val("amp"), O=val("offset");
  const phase=(t*f)%1;
  let x=0;
  switch(wave.value){
    case "sine": x=Math.sin(2*Math.PI*phase); break;
    case "square": x=phase < val("duty")/100 ? 1 : -1; break;
    case "triangle": x=phase<0.5 ? 4*phase-1 : 3-4*phase; break;
    case "saw": x=2*phase-1; break;
  }
  return O+A*x;
}

function drawGrid(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#050b08";ctx.fillRect(0,0,w,h);

  const divX=10,divY=8;
  const dx=w/divX,dy=h/divY;

  ctx.lineWidth=1;
  for(let i=0;i<=divX;i++){
    ctx.strokeStyle=i===divX/2?"#496b55":"#193322";
    ctx.beginPath();ctx.moveTo(i*dx,0);ctx.lineTo(i*dx,h);ctx.stroke();
  }
  for(let i=0;i<=divY;i++){
    ctx.strokeStyle=i===divY/2?"#496b55":"#193322";
    ctx.beginPath();ctx.moveTo(0,i*dy);ctx.lineTo(w,i*dy);ctx.stroke();
  }

  ctx.fillStyle="#7f9a86";
  ctx.font="12px Arial";
  ctx.fillText("0 V",8,h/2-5);
  ctx.fillText((val("vscale")*4).toFixed(1)+" V",8,18);
  ctx.fillText((-val("vscale")*4).toFixed(1)+" V",8,h-5);
}

function draw(){
  drawGrid();

  const w=canvas.width,h=canvas.height;
  const tNow=(performance.now()-startTime)/1000;
  const secPerDiv=val("timebase");
  const totalTime=secPerDiv*10;
  const scale=val("vscale");
  const verticalOffset=val("vpos");

  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.strokeStyle="#53e27c";

  let first=true,min=Infinity,max=-Infinity;
  for(let x=0;x<w;x++){
    const t=tNow+(x/w)*totalTime;
    const yVal=signal(t);
    min=Math.min(min,yVal);max=Math.max(max,yVal);
    const display=yVal-verticalOffset;
    const y=h/2-(display/(scale))* (h/8);
    if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
  }
  ctx.stroke();

  document.getElementById("rMax").textContent=max.toFixed(2)+" V";
  document.getElementById("rMin").textContent=min.toFixed(2)+" V";

  if(running) animationId=requestAnimationFrame(draw);
}

document.getElementById("start").onclick=()=>{
  if(!running){
    running=true;startTime=performance.now();
    document.getElementById("status").textContent="Signal en cours";
    draw();
  }
};
document.getElementById("stop").onclick=()=>{
  running=false;
  cancelAnimationFrame(animationId);
  document.getElementById("status").textContent="Signal arrêté";
  draw();
};
document.getElementById("reset").onclick=()=>{
  wave.value="sine";freq.value=10;amp.value=2;offset.value=0;
  duty.value=50;timebase.value=0.01;vscale.value=2;vpos.value=0;
  updateLabels();draw();
};

updateLabels();
draw();
</script>
</body>
</html>
